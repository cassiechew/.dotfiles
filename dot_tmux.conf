#source "$HOME"/.config/tmux/conf.d/*.conf


# run-shell 'for f in "$HOME"/.config/tmux/conf.d/*.conf; do [ -r "$f" ] && tmux source-file "$f"; done'

# Prepend Homebrew only once: theme-watcher re-sources this file on every
# light/dark switch, and an unguarded prepend added another copy each time.
if-shell 'case ":$PATH:" in *:/opt/homebrew/bin:*) exit 1;; esac' \
  'set-environment -g PATH "/opt/homebrew/bin:$PATH"'
source-file -q ~/.config/tmux/conf.d/*.conf
