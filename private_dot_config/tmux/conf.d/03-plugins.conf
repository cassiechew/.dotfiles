set -g @extrakto_split_direction 'p'    # popup
set -g @extrakto_popup_size '70%'       # a bit larger
set -g @extrakto_copy_key 'enter'       # use default behavior
set -g @extrakto_insert_key 'tab'
set -g @extrakto_fzf_unset_default_opts 'false'

run-shell ~/.config/tmux/plugins/extrakto/extrakto.tmux

# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'datamadsen/nunchux'
set -g @plugin 'jaclu/tmux-menus'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'


set -g @plugin 'thepante/tmux-git-autofetch'

set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'erikw/tmux-dark-notify'

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run '~/.config/tmux/plugins/tpm/tpm'

