set -g @dark_mode_theme 'catppuccin_frappe'
set -g @light_mode_theme 'catppuccin_latte'


#set -g window-status-format " #I#{?#{!=:#W,#T}, (#W),} "
#set -g window-status-current-format " #I#{?#{!=:#W,#T}, (#W),} "

set -g pane

set -g status-right-length 150
set -g status-left-length 150

#set -g status-left "#{prefix_highlight} | %a %H:%M "
#set -g status-left "#[fg=#{@thm_fg} bold]TMUX (#S) "
set -g status-left ""
#set -ga status-left "#{?client_prefix,#[fg=#{@thm_red} bold]PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]COPY ,#[fg=#{@thm_green} bold]NORMAL }}"
set -ga status-left "#{?client_prefix,#[fg=#1e1e2e bg=#f38ba8 bold] PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=#1e1e2e bg=#f9e2af bold] COPY ,#[fg=#1e1e2e bg=#a6e3a1 bold] NORMAL }}"

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Window default format (inactive)
set -g @catppuccin_window_default_fill "number"  # or "none", "all"
set -g @catppuccin_window_text " #W"

# Window current format (active)
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W"

