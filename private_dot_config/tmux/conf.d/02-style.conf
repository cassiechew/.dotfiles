# Auto theme flavour + background by macOS appearance
# Generates temp conf that: unsets stale @thm_* and @catppuccin_* vars,
# then sets the correct flavor + our color overrides.
run-shell '~/.config/tmux/scripts/gen-theme.sh'
source-file -q /tmp/tmux-theme-mode.conf

