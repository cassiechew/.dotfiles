# Reload tmux.conf with prefix-r
bind-key -N "Reload tmux config" r source-file ~/.tmux.conf \; display "Reloaded conf"

# https://gist.github.com/mcollina/3596f6e06b1ecabfcb402695b3ff655e
# splitting panes
bind -N "Split pane right" | split-window -h
bind -N "Split pane down" - split-window -v

# set prefix to ctrl+a like screen
unbind-key C-b
set -g prefix C-a
bind -N "Send C-a to the pane" -r C-a send-prefix

# switch windows alt+number
bind-key -n -N "Window 1" C-1 select-window -t 1
bind-key -n -N "Window 2" C-2 select-window -t 2
bind-key -n -N "Window 3" C-3 select-window -t 3
bind-key -n -N "Window 4" C-4 select-window -t 4
bind-key -n -N "Window 5" C-5 select-window -t 5
bind-key -n -N "Window 6" C-6 select-window -t 6
bind-key -n -N "Window 7" C-7 select-window -t 7
bind-key -n -N "Window 8" C-8 select-window -t 8
bind-key -n -N "Window 9" C-9 select-window -t 9
bind-key -n -N "Window 10" C-0 select-window -t 10

