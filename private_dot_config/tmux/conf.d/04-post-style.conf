# window look and feel
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_pink},fg=#{@thm_bg},bold"

# Override pane borders AFTER catppuccin (queued via run-shell so it lands
# after TPM's queued catppuccin source-file commands)
run-shell ' \
  MODE=$(defaults read -g AppleInterfaceStyle 2>/dev/null); \
  if [ "$MODE" = "Dark" ]; then \
    tmux set -wg pane-border-style "fg=##FF4D94,bg=##4D0026"; \
    tmux set -wg pane-active-border-style "fg=##FF0066,bg=##4D0026"; \
    tmux set -g window-style "bg=##4D0026"; \
    tmux set -g window-active-style "bg=##4D0026"; \
  else \
    tmux set -wg pane-border-style "fg=##FF4D94,bg=##FFF0F5"; \
    tmux set -wg pane-active-border-style "fg=##FF0066,bg=##FFF0F5"; \
    tmux set -g window-style "bg=##FFF0F5"; \
    tmux set -g window-active-style "bg=##FFF0F5"; \
  fi \
'

